[project]
name = "eunomia-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "midhun kumar", email = "midh0001@student.monash.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "faker>=40.37.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "python-dotenv>=1.2.3",
    "apscheduler>=3.10",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
# `embedding_backend = "local"` — pulls torch, ~1GB. The default "api" backend
# (OpenAI-compatible / Ollama) needs none of this.
local-embeddings = ["sentence-transformers>=3.0"]

[tool.uv]
package = false
