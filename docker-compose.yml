services:
  backend:
    build: ./backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - EUNOMIA_API_TOKEN=${EUNOMIA_API_TOKEN}
      - DEBUG=false
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS:-true}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SQLITE_PATH=/data/db.sqlite3
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8000/api/connectors/google/callback}
    volumes:
      - eunomia-data:/data

  worker:
    build: ./backend
    restart: always
    command: sh -c "python manage.py migrate --noinput && python manage.py run_worker"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - EUNOMIA_API_TOKEN=${EUNOMIA_API_TOKEN}
      - SQLITE_PATH=/data/db.sqlite3
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
    volumes:
      - eunomia-data:/data
    depends_on:
      - backend

  mcp:
    build: ./backend
    restart: always
    command: python mcp_server.py --http --host 0.0.0.0 --port 8765
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - EUNOMIA_API_TOKEN=${EUNOMIA_API_TOKEN}
      - SQLITE_PATH=/data/db.sqlite3
    ports:
      - "8765:8765"
    volumes:
      - eunomia-data:/data
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_API_TOKEN: ${NEXT_PUBLIC_API_TOKEN:-}
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  eunomia-data:
