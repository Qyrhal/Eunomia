name: Release images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            build-contexts: docs=./docs
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: APP_VERSION=${{ github.ref_name }}
          build-contexts: ${{ matrix.build-contexts }}
          tags: |
            ghcr.io/qyrhal/eunomia-${{ matrix.name }}:latest
            ghcr.io/qyrhal/eunomia-${{ matrix.name }}:${{ github.ref_name }}
