services:
  surrealdb:
    # Pinned to 2.x: SurrealDB 3.x dropped the MTREE index syntax this
    # schema uses (DEFINE INDEX ... MTREE DIMENSION ... DIST COSINE TYPE F32).
    image: surrealdb/surrealdb:v2.3
    user: root
    entrypoint:
      - /surreal
      - start
      - --user
      - ${SURREAL_USER:-root}
      - --pass
      - ${SURREAL_PASS:-root}
      - rocksdb:/data/eunomia.db
    ports:
      - "8000:8000"
    volumes:
      - eunomia-surreal-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-root}
      - SURREAL_NS=${SURREAL_NS:-eunomia}
      - SURREAL_DB=${SURREAL_DB:-eunomia}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDINGS_BACKEND=${EMBEDDINGS_BACKEND:-openai}
      - CORS_ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      surrealdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build: ./backend
    command: ["python", "mcp_server.py", "--http", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "8765:8765"
    environment:
      - EUNOMIA_API_TOKEN=${EUNOMIA_API_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-root}
      - SURREAL_NS=${SURREAL_NS:-eunomia}
      - SURREAL_DB=${SURREAL_DB:-eunomia}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDINGS_BACKEND=${EMBEDDINGS_BACKEND:-openai}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  eunomia-surreal-data:
