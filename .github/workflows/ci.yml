name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Tests run against an in-memory SurrealDB, so no service container is
      # needed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run
      # The whole suite under the --allow-funcs list read out of docker-compose.yml.
      - run: TEST_HARDENED=1 cargo nextest run
      # The isolation proof with the application-level owner/vault filters switched off.
      - run: ISOLATION_TEST_NO_APP_FILTERS=1 cargo nextest run --test isolation
      - run: cargo build --release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      # The committed client in src/lib/gen must match backend/openapi.json.
      - name: API client is up to date
        run: |
          bun run gen:api
          git diff --exit-code -- src/lib/gen
          test -z "$(git status --porcelain -- src/lib/gen)"
      - run: bun run lint
      # `next build` generates `.next/types/*.d.ts`, which `next-env.d.ts`
      # references and tsconfig.json includes -- both are gitignored
      # (Next.js regenerates them), so a fresh checkout has neither until
      # something runs Next at least once. Build first, then re-typecheck.
      - run: bun run build
      - run: bunx tsc --noEmit

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker compose -p eunomia-ci build

      # Throwaway secrets, generated fresh for every run.
      - name: Start stack
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export ENCRYPTION_KEY="$(openssl rand -hex 32)"
          # The connectors spec points connectors at its in-test mock provider.
          export EUNOMIA_ALLOW_CONNECTOR_BASE_URL=1
          docker compose -p eunomia-ci up -d backend frontend

      - name: Wait for backend and frontend
        run: |
          for url in http://localhost:8001/healthz http://localhost:3000; do
            for _ in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then
                echo "$url is up"
                continue 2
              fi
              sleep 2
            done
            echo "$url did not become ready" >&2
            docker compose -p eunomia-ci logs --no-color
            exit 1
          done

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bunx playwright install --with-deps chromium
        working-directory: frontend

      # E2E_BASE_URL points Playwright at the running compose frontend
      # instead of starting `bun run dev`.
      - run: bunx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose -p eunomia-ci down -v

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # connect-agents.sh against a throwaway HOME and a mock API, with jq and
      # again with the python3 fallback.
      - run: CONNECT_JSON=py bash scripts/tests/connect-agents.test.sh
      # Every script test that needs no Docker, by glob so a new one cannot be forgotten.
      # SKIP lists the ones that need real containers (upgrade-surreal-v3 has its own job below).
      - run: |
          SKIP="upgrade-surreal-v3.test.sh"
          rc=0
          for t in scripts/tests/*.test.sh; do
            case " $SKIP " in *" $(basename "$t") "*) echo "skip $t"; continue ;; esac
            echo "== $t"; bash "$t" || rc=1
          done
          exit $rc
      - run: bash -n scripts/*.sh scripts/ci/*.sh scripts/tests/*.sh backend/scripts/backup/eunomia-backup.sh

  # Real SurrealDB 2.7 -> 3.3 data move (scripts/upgrade-surreal-v3.sh), including a
  # forced mismatch that must roll back, and an upgrade from the released v1.2.2
  # compose file (surrealdb:v2.3, no backup service). Throwaway compose project fw-upgrade.
  upgrade-surreal-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # case B reads the released v1.2.2 compose file from its tag
      - run: bash scripts/tests/upgrade-surreal-v3.test.sh

  # Backups really restore, on a throwaway SurrealDB 3.3.1 container. The two drills share the
  # container name fw-backup-db and port 8211, so they run one after the other.
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/restore-drill.sh
      - run: bash scripts/restore-drill-tenancy.sh
