services:
  surrealdb:
    # Exact patch pin; upgrade deliberately. Hardened: every
    # capability is denied except the function families the backend's SQL uses
    # (docs/architecture/surreal-functions.md), guests are refused, and a runaway query or
    # transaction is cut off. tests run the suite under the same --allow-funcs list.
    image: surrealdb/surrealdb:v3.3.1
    user: root
    entrypoint:
      - /surreal
      - start
      - --user
      - ${SURREAL_USER:-root}
      - --pass
      - ${SURREAL_PASS:-root}
      - --deny-all
      # --deny-all alone may also deny RPC, HTTP (the isready healthcheck) and root queries on 3.x:
      # allow those explicitly. Not yet run against a live 3.3.1 server (docs/architecture/foundation-plan.md).
      - --allow-rpc
      - --allow-http
      - --allow-arbitrary-query=system
      - --allow-funcs=time,string,search,count,array,vector,math
      - --deny-guests
      - --query-timeout=60s
      - --transaction-timeout=60s
      - rocksdb:/data/eunomia.db
    # No host port: only the backend talks to the DB, over the compose network.
    volumes:
      # scripts/upgrade-surreal-v3.sh sets SURREAL_DATA_VOLUME=eunomia-surreal-data-v3
      # in .env once the 2.x data has been moved to a fresh 3.x volume.
      - ${SURREAL_DATA_VOLUME:-eunomia-surreal-data}:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/qyrhal/eunomia-backend:${EUNOMIA_IMAGE_TAG:-latest}
    build:
      context: ./backend
      additional_contexts:
        docs: ./docs
    restart: always
    ports:
      # Loopback only: local agents use http://localhost:8001. Browsers and remote agents go
      # through the frontend (:3000), whose address the backend trusts for X-Forwarded-For.
      # Set BACKEND_BIND=0.0.0.0 to expose it on the LAN (traffic then skips the proxy chain).
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8001}:8001"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-root}
      - SURREAL_NS=${SURREAL_NS:-eunomia}
      - SURREAL_DB=${SURREAL_DB:-eunomia}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDINGS_BACKEND=${EMBEDDINGS_BACKEND:-openai}
      - CORS_ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost:3000}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8001}
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-30}
      - RATE_LIMIT_USER_PER_MIN=${RATE_LIMIT_USER_PER_MIN:-1200}
      - RATE_LIMIT_TOKEN_PER_MIN=${RATE_LIMIT_TOKEN_PER_MIN:-600}
      - RATE_LIMIT_AUTH_PER_MIN=${RATE_LIMIT_AUTH_PER_MIN:-20}
      # the frontend service (resolved by name, re-resolved every minute): the only peer whose X-Forwarded-For is believed
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-frontend}
      - RATE_LIMIT_WEBHOOK_PER_MIN=${RATE_LIMIT_WEBHOOK_PER_MIN:-120}
      - RATE_LIMIT_REFRESH_PER_MIN=${RATE_LIMIT_REFRESH_PER_MIN:-300}
      - SIGNUP=${SIGNUP:-open}
      - SIGNUP_ALLOWLIST=${SIGNUP_ALLOWLIST:-}
      - EUNOMIA_SIGNUP_ORG=${EUNOMIA_SIGNUP_ORG:-join}
      - EUNOMIA_ADMIN_EMAILS=${EUNOMIA_ADMIN_EMAILS:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-auto}
      - CAPSULE_ARGS=${CAPSULE_ARGS:-off}
      - ALLOW_PRIVATE_LLM_URL=${ALLOW_PRIVATE_LLM_URL:-1}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-365}
      - SESSION_RETENTION_DAYS=${SESSION_RETENTION_DAYS:-7}
      - ENCRYPTION_KEY_LEGACY_EMPTY=${ENCRYPTION_KEY_LEGACY_EMPTY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=eunomia-backend
    # Read/write access to ONE small status directory -- not the repo, not
    # the docker socket. The `updater` service below does the actual update.
    volumes:
      - ./update-status:/update-status
    depends_on:
      surrealdb:
        condition: service_healthy
    healthcheck:
      # /readyz checks the control database and its migrations, not just the process.
      # start_period covers a first boot that moves an old install into its org database.
      test: ["CMD", "curl", "-f", "http://localhost:8001/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30m

  frontend:
    image: ghcr.io/qyrhal/eunomia-frontend:${EUNOMIA_IMAGE_TAG:-latest}
    build: ./frontend
    ports:
      # Set FRONTEND_BIND=127.0.0.1 when a reverse proxy runs on this host (docs/deployment.md).
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    environment:
      # 1 only behind a trusted reverse proxy: believe the X-Forwarded-For/Proto it sets (src/proxy.ts)
      - FRONTEND_TRUST_FORWARDED=${FRONTEND_TRUST_FORWARDED:-}
    depends_on:
      backend:
        condition: service_healthy

  # Applies updates when you click "Update now" in Settings (see
  # scripts/updater.sh). Not web-facing: no ports, its only input is the
  # marker file the backend writes into ./update-status.
  updater:
    image: docker:27-cli
    restart: unless-stopped
    entrypoint: ["sh", "-c", "cp /eunomia/scripts/updater.sh /tmp/updater.sh && exec sh /tmp/updater.sh"]
    volumes:
      - .:/eunomia
      - /var/run/docker.sock:/var/run/docker.sock

  # Nightly encrypted SurrealDB export at 03:00 into the eunomia-backups
  # volume (see backend/scripts/backup/). No ports. If BACKUP_ENCRYPTION_KEY is
  # empty it generates a key into the volume on first start (see docs/deployment.md).
  backup:
    image: ghcr.io/qyrhal/eunomia-backup:${EUNOMIA_IMAGE_TAG:-latest}
    build: ./backend/scripts/backup
    restart: unless-stopped
    environment:
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - TZ=${TZ:-UTC}
      - SURREAL_ENDPOINT=http://surrealdb:8000
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-root}
      - SURREAL_NS=${SURREAL_NS:-eunomia}
      - SURREAL_DB=${SURREAL_DB:-eunomia}
    volumes:
      - eunomia-backups:/backups
    depends_on:
      surrealdb:
        condition: service_healthy

volumes:
  eunomia-surreal-data:
  eunomia-surreal-data-v3:
  eunomia-backups:
