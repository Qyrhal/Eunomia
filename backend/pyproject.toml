[project]
name = "eunomia-backend"
version = "0.1.0"
description = "Eunomia backend (FastAPI + SurrealDB)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "surrealdb",
    "pydantic-settings",
    "httpx",
    "cryptography",
    "apscheduler>=3.10",
    "mcp>=2.1.1",
    "python-dotenv",
    "openai",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "connectors"]
