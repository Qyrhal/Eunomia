[package]
name = "eunomia-backend-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
eunomia-backend = { path = ".." }

# Own workspace: does not join (or rebuild with) the backend build.
[workspace]

[[bin]]
name = "jsonrpc_parse"
path = "fuzz_targets/jsonrpc_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_map"
path = "fuzz_targets/source_map.rs"
test = false
doc = false
bench = false

[[bin]]
name = "summaries"
path = "fuzz_targets/summaries.rs"
test = false
doc = false
bench = false
