[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eunomia"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
