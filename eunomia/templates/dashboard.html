<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eunomia</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <nav class="sidebar">
    <div class="brand">Eunomia</div>
    <ul class="nav-list" id="nav-list"></ul>

    {% if vault_configured %}
      <button class="btn btn-primary new-note-btn" id="new-note-btn">+ New note</button>
    {% else %}
      <a class="btn btn-primary new-note-btn" href="/settings">Set up vault to add notes</a>
    {% endif %}
    <button class="sync-btn" id="sync-btn">Sync vault</button>

    <div class="nav-footer">
      <a class="nav-item" href="/settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        <span class="label">Settings</span>
      </a>
    </div>
  </nav>

  <main>
    <h1 class="page-title" id="page-title">All</h1>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Search notes">
    </div>
    <div class="note-group" id="note-group"></div>
  </main>

  {% if vault_configured %}
  <div class="modal-backdrop" id="new-note-backdrop">
    <div class="modal">
      <h2>New note</h2>
      <form id="new-note-form">
        <input type="text" name="title" placeholder="Title" required autofocus>
        <select name="bucket" id="new-note-bucket"></select>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="new-note-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
        <p class="hint" id="new-note-error"></p>
      </form>
    </div>
  </div>
  {% endif %}

<script>
const BUCKETS = {{ buckets_json | safe }};
const ICONS = {
  uni: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 2.5 3 6 3s6-1.5 6-3v-5"/></svg>',
  work: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
  business: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><line x1="9" y1="8" x2="9" y2="8"/><line x1="15" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="9" y2="12"/><line x1="15" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg>',
  other: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>',
  all: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
};
const DEFAULT_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 9h16"/></svg>';

let notes = {{ notes_json | safe }};
let activeBucket = "all";
let query = "";

const navList = document.getElementById("nav-list");
const noteGroup = document.getElementById("note-group");
const pageTitle = document.getElementById("page-title");
const searchInput = document.getElementById("search-input");
const syncBtn = document.getElementById("sync-btn");

function counts() {
  const c = { all: notes.length };
  for (const b of BUCKETS) c[b.key] = notes.filter(n => n.bucket === b.key).length;
  return c;
}

function renderNav() {
  const c = counts();
  const items = [{ key: "all", label: "All" }, ...BUCKETS];
  navList.innerHTML = items.map(b => `
    <li>
      <button class="nav-item ${b.key === activeBucket ? "active" : ""}" data-bucket="${b.key}">
        ${ICONS[b.key] || DEFAULT_ICON}
        <span class="label">${escapeHtml(b.label)}</span>
        <span class="count">${c[b.key] || 0}</span>
      </button>
    </li>
  `).join("");
  navList.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => {
      activeBucket = btn.dataset.bucket;
      render();
    });
  });
}

function renderNotes() {
  const activeMeta = BUCKETS.find(b => b.key === activeBucket);
  pageTitle.textContent = activeBucket === "all" ? "All" : (activeMeta ? activeMeta.label : activeBucket);
  let visible = activeBucket === "all" ? notes : notes.filter(n => n.bucket === activeBucket);
  if (query) {
    const q = query.toLowerCase();
    visible = visible.filter(n =>
      n.title.toLowerCase().includes(q) || n.tags.some(t => t.toLowerCase().includes(q))
    );
  }
  if (visible.length === 0) {
    noteGroup.innerHTML = `<div class="empty-state">No notes here yet.</div>`;
    return;
  }
  noteGroup.innerHTML = visible.map(n => `
    <div class="note-row">
      <span class="note-title">${escapeHtml(n.title)}</span>
      <span class="note-tags">${n.tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join("")}</span>
    </div>
  `).join("");
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function render() {
  renderNav();
  renderNotes();
}

async function refreshNotes() {
  const resp = await fetch("/api/notes");
  notes = await resp.json();
  render();
}

searchInput.addEventListener("input", (e) => {
  query = e.target.value;
  renderNotes();
});

syncBtn.addEventListener("click", async () => {
  syncBtn.disabled = true;
  syncBtn.textContent = "Syncing…";
  try {
    await fetch("/sync", { method: "POST" });
    await refreshNotes();
  } finally {
    syncBtn.disabled = false;
    syncBtn.textContent = "Sync vault";
  }
});

const newNoteBtn = document.getElementById("new-note-btn");
const newNoteBackdrop = document.getElementById("new-note-backdrop");
if (newNoteBtn) {
  const form = document.getElementById("new-note-form");
  const bucketSelect = document.getElementById("new-note-bucket");
  const errorEl = document.getElementById("new-note-error");
  const cancelBtn = document.getElementById("new-note-cancel");

  const openModal = () => {
    bucketSelect.innerHTML = BUCKETS.map(b => `<option value="${b.key}">${escapeHtml(b.label)}</option>`).join("");
    errorEl.textContent = "";
    form.reset();
    newNoteBackdrop.classList.add("open");
    form.title.focus();
  };
  const closeModal = () => newNoteBackdrop.classList.remove("open");

  newNoteBtn.addEventListener("click", openModal);
  cancelBtn.addEventListener("click", closeModal);
  newNoteBackdrop.addEventListener("click", (e) => { if (e.target === newNoteBackdrop) closeModal(); });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = new URLSearchParams(new FormData(form));
    const resp = await fetch("/notes", { method: "POST", body });
    if (!resp.ok) {
      const detail = await resp.json().catch(() => ({}));
      errorEl.textContent = detail.detail || "Couldn't create the note.";
      return;
    }
    closeModal();
    await refreshNotes();
  });
}

render();
</script>
</body>
</html>
