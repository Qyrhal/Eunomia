services:
  surrealdb:
    # Pinned to 2.x: SurrealDB 3.x dropped the MTREE index syntax this
    # schema uses (DEFINE INDEX ... MTREE DIMENSION ... DIST COSINE TYPE F32).
    image: surrealdb/surrealdb:v2.3
    user: root
    entrypoint:
      - /surreal
      - start
      - --user
      - ${SURREAL_USER:-root}
      - --pass
      - ${SURREAL_PASS:-root}
      - rocksdb:/data/eunomia.db
    # No host port: only the backend talks to the DB, over the compose network.
    volumes:
      - eunomia-surreal-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/qyrhal/eunomia-backend:${EUNOMIA_IMAGE_TAG:-latest}
    build:
      context: ./backend
      additional_contexts:
        docs: ./docs
    restart: always
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASS=${SURREAL_PASS:-root}
      - SURREAL_NS=${SURREAL_NS:-eunomia}
      - SURREAL_DB=${SURREAL_DB:-eunomia}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDINGS_BACKEND=${EMBEDDINGS_BACKEND:-openai}
      - CORS_ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Read/write access to ONE small status directory -- not the repo, not
    # the docker socket. The `updater` service below does the actual update.
    volumes:
      - ./update-status:/update-status
    depends_on:
      surrealdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: ghcr.io/qyrhal/eunomia-frontend:${EUNOMIA_IMAGE_TAG:-latest}
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Applies updates when you click "Update now" in Settings (see
  # scripts/updater.sh). Not web-facing: no ports, its only input is the
  # marker file the backend writes into ./update-status.
  updater:
    image: docker:27-cli
    restart: unless-stopped
    entrypoint: ["sh", "-c", "cp /eunomia/scripts/updater.sh /tmp/updater.sh && exec sh /tmp/updater.sh"]
    volumes:
      - .:/eunomia
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  eunomia-surreal-data:
